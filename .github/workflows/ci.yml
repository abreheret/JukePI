name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: the workflow never needs to write to the repository.
permissions:
  contents: read

# A newer push cancels the run still going for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Rust tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music-server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: music-server
      - name: Tests
        run: cargo test --locked
      - name: Release build compiles
        run: cargo build --release --locked

  android:
    name: Android app (debug build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: SDK platform and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Build the release APK (shrinking rules)
        run: ./gradlew assembleRelease --no-daemon
